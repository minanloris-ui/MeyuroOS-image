<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="60" viewBox="0 0 180 60">
  <defs>
    <linearGradient id="activeGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c58b4" stop-opacity=".78"/>
      <stop offset=".58" stop-color="#173873" stop-opacity=".72"/>
      <stop offset="1" stop-color="#6f3f93" stop-opacity=".67"/>
    </linearGradient>
    <linearGradient id="inactiveGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#244b8a" stop-opacity=".61"/>
      <stop offset="1" stop-color="#3b315e" stop-opacity=".58"/>
    </linearGradient>
  </defs>

  <!-- Active 9-slice frame. Transparent pixels outside the corner paths
       preserve the 16 px rounded silhouette. -->
  <path id="decoration-topleft" d="M20 0H16A16 16 0 0 0 0 16v4h20z" fill="url(#activeGlass)"/>
  <rect id="decoration-top" x="20" y="0" width="20" height="20" fill="url(#activeGlass)"/>
  <path id="decoration-topright" d="M40 0h4a16 16 0 0 1 16 16v4H40z" fill="url(#activeGlass)"/>
  <rect id="decoration-left" x="0" y="20" width="20" height="20" fill="url(#activeGlass)"/>
  <rect id="decoration-center" x="20" y="20" width="20" height="20" fill="url(#activeGlass)"/>
  <rect id="decoration-right" x="40" y="20" width="20" height="20" fill="url(#activeGlass)"/>
  <path id="decoration-bottomleft" d="M0 40h20v20h-4A16 16 0 0 1 0 44z" fill="url(#activeGlass)"/>
  <rect id="decoration-bottom" x="20" y="40" width="20" height="20" fill="url(#activeGlass)"/>
  <path id="decoration-bottomright" d="M40 40h20v4a16 16 0 0 1-16 16h-4z" fill="url(#activeGlass)"/>

  <!-- One-pixel luminous outer edge, split across the same nine slices. -->
  <path d="M20 .75h20" stroke="#d9ebff" stroke-opacity=".78" fill="none"/>
  <path d="M20 .75h-4A15.25 15.25 0 0 0 .75 16v4" stroke="#d9ebff" stroke-opacity=".78" fill="none"/>
  <path d="M40 .75h4A15.25 15.25 0 0 1 59.25 16v4" stroke="#ffd7f4" stroke-opacity=".72" fill="none"/>
  <path d="M.75 20v20M59.25 20v20" stroke="#b7d9ff" stroke-opacity=".52"/>
  <path d="M.75 40v4A15.25 15.25 0 0 0 16 59.25h4" stroke="#8fc7ff" stroke-opacity=".62" fill="none"/>
  <path d="M20 59.25h20" stroke="#8fc7ff" stroke-opacity=".62"/>
  <path d="M40 59.25h4A15.25 15.25 0 0 0 59.25 44v-4" stroke="#efb8ff" stroke-opacity=".64" fill="none"/>

  <!-- Inactive frame. -->
  <path id="decoration-inactive-topleft" d="M80 0h-4a16 16 0 0 0-16 16v4h20z" fill="url(#inactiveGlass)"/>
  <rect id="decoration-inactive-top" x="80" y="0" width="20" height="20" fill="url(#inactiveGlass)"/>
  <path id="decoration-inactive-topright" d="M100 0h4a16 16 0 0 1 16 16v4h-20z" fill="url(#inactiveGlass)"/>
  <rect id="decoration-inactive-left" x="60" y="20" width="20" height="20" fill="url(#inactiveGlass)"/>
  <rect id="decoration-inactive-center" x="80" y="20" width="20" height="20" fill="url(#inactiveGlass)"/>
  <rect id="decoration-inactive-right" x="100" y="20" width="20" height="20" fill="url(#inactiveGlass)"/>
  <path id="decoration-inactive-bottomleft" d="M60 40h20v20h-4a16 16 0 0 1-16-16z" fill="url(#inactiveGlass)"/>
  <rect id="decoration-inactive-bottom" x="80" y="40" width="20" height="20" fill="url(#inactiveGlass)"/>
  <path id="decoration-inactive-bottomright" d="M100 40h20v4a16 16 0 0 1-16 16h-4z" fill="url(#inactiveGlass)"/>

  <!-- Blur mask for the complete rounded decoration. -->
  <path id="mask-topleft" d="M140 0h-4a16 16 0 0 0-16 16v4h20z" fill="#fff"/>
  <rect id="mask-top" x="140" y="0" width="20" height="20" fill="#fff"/>
  <path id="mask-topright" d="M160 0h4a16 16 0 0 1 16 16v4h-20z" fill="#fff"/>
  <rect id="mask-left" x="120" y="20" width="20" height="20" fill="#fff"/>
  <rect id="mask-center" x="140" y="20" width="20" height="20" fill="#fff"/>
  <rect id="mask-right" x="160" y="20" width="20" height="20" fill="#fff"/>
  <path id="mask-bottomleft" d="M120 40h20v20h-4a16 16 0 0 1-16-16z" fill="#fff"/>
  <rect id="mask-bottom" x="140" y="40" width="20" height="20" fill="#fff"/>
  <path id="mask-bottomright" d="M160 40h20v4a16 16 0 0 1-16 16h-4z" fill="#fff"/>

  <rect id="decoration-maximized-center" x="20" y="20" width="20" height="20" fill="#173873" fill-opacity=".93"/>
  <rect id="decoration-maximized-inactive-center" x="80" y="20" width="20" height="20" fill="#1d3158" fill-opacity=".9"/>
</svg>
